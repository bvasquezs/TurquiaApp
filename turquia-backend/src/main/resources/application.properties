spring.application.name=turquia-backend
server.port=8080

# Configuración de MySQL (Asegúrate de tener XAMPP/MySQL encendido)
spring.datasource.url=jdbc:mysql://localhost:3306/turquia_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate (Crea la tabla automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true